[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "oscalis-mcp"
version = "0.1.0"
description = "MCP server exposing multi-framework GRC and crosswalk capabilities powered by NIST OSCAL."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Cyversight LLC" }, { name = "Al Lyle" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp[cli]>=2.3,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "jsonschema>=4.20",
    "types-jsonschema",
    "openpyxl>=3.1",
    "types-openpyxl",
]

[project.scripts]
oscalis-mcp = "oscalis.server:main"

[project.urls]
Homepage = "https://github.com/Cyversight/oscalis-mcp"
Repository = "https://github.com/Cyversight/oscalis-mcp"
Issues = "https://github.com/Cyversight/oscalis-mcp/issues"
Cyversight = "https://cyversight.com"

[tool.hatch.build.targets.wheel]
packages = ["src/oscalis"]

# Ship the OSCAL data inside the package so an installed copy works from any directory (see config.default_data_dir).
[tool.hatch.build.targets.wheel.force-include]
"data" = "oscalis/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"checks/*" = ["S603", "S607"]
"src/scripts/*" = ["S310"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src,checks"
files = ["src/oscalis", "src/scripts", "tests", "checks"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
